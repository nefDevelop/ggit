services:
  ggit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_TARGET=build-swagger-cdn
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - GIN_MODE=release
    ports:
      - "3005:3005"
      - "10022:22"
    volumes:
      - ./data:/data
    networks:
      - ggit-network

networks:
  ggit-network:
    driver: bridge
