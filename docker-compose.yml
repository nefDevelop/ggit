services:
  ggit:
    build: .
    container_name: ggit
    restart: always
    environment:
      # --- CONFIGURATION PATHS ---
      # Root directory of the application. Defaults to the directory of the binary.
      - GGIT_WORK_DIR=/app/ggit

      # Path to custom configuration and data overrides. 
      # Now automatically falls back to '/app/ggit/data' if '/app/ggit/custom' is missing.
      - GGIT_CUSTOM=/app/ggit/data

      # --- SECURITY & PERMISSIONS ---
      # Skip the check that ensures the application is running as the configured 'RUN_USER'.
      # Useful if you are running as root or a different user inside the container.
      - GGIT_SKIP_RUN_USER_CHECK=true

      # --- MONITORING & DEBUGGING ---
      # Set to 'release' for production, 'dev' for development logs.
      - GIN_MODE=release

      # Enable tracing output to stdout (OpenTelemetry).
      - GGIT_TRACE_STDOUT=false

      # --- SYSTEM ---
      # Force a specific home directory if needed.
      - HOME=/app/ggit/data/home

    volumes:
      # Map the host data directory to the container's data path.
      - ./data:/app/ggit/data
      - ./log:/app/ggit/log

    ports:
      # Web Interface
      - "5555:3005"
      # SSH Service
      - "2222:22"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
