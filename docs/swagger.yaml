basePath: /api/v2
definitions:
  database.AccessToken:
    properties:
      createdUnix:
        format: int64
        type: integer
      id:
        type: integer
      name:
        type: string
      sha1:
        type: string
      sha256:
        type: string
      updatedUnix:
        format: int64
        type: integer
      userID:
        type: integer
    type: object
  types.AuditLogResponse:
    properties:
      actor_id:
        type: integer
      actor_name:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      op_name:
        type: string
      op_type:
        type: integer
