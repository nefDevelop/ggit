# Docs: https://git.io/JCUAY
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "mod:"
    # Agrupa todas las actualizaciones en un único PR mensual
    groups:
      all-dependencies:
        patterns:
          - "*"
